# fly.toml app configuration file generated for connect-grow on 2026-06-09T21:54:45Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'connect-grow'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
  processes = ['app']
  size = 'shared-cpu-2x'
