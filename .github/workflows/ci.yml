name: CI

on:
  pull_request:
    # A linha do dia a dia e a `qa`: sem ela, os PRs da equipe entravam sem rodar teste nenhum.
    branches: [main, qa]
  push:
    branches: [main, qa]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # A divida que travava estes passos foi paga (o lint e o typecheck passam limpos
      # nas duas linhas), entao eles rodam aqui de verdade: sem o typecheck, um campo que a
      # API devolve nulo passa e quebra no navegador.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes das regras do ESLint
        run: npm run test:eslint-rules
