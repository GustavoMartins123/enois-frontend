name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Lint e typecheck entram aqui quando a main passar neles (hoje: ~300
      # erros de lint, quase todos local/type-boundaries em src/types, e ~60
      # erros de TypeScript).
      - name: Testes unitários
        run: npm test

      - name: Testes das regras do ESLint
        run: npm run test:eslint-rules
