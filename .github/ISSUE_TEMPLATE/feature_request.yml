name: Sugerir uma melhoria
description: Uma ideia de funcionalidade ou de ajuste na interface
labels: ["enhancement"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Que problema isso resolve
      description: Descreva a situação de quem usa, não a solução técnica.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: O que você imagina
    validations:
      required: true
  - type: textarea
    id: alternativas
    attributes:
      label: Alternativas consideradas
    validations:
      required: false
