name: Relatar um problema
description: Algo na interface não funciona como deveria
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de abrir: procure nas issues existentes e confirme que é o **frontend** (a tela).
        Se for falha de **segurança**, não use este formulário — veja o `SECURITY.md`.
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: O que você viu, e o que esperava ver.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Como reproduzir
      placeholder: |
        1. abrir /feed
        2. clicar em ...
        3. a tela faz ...
    validations:
      required: true
  - type: input
    id: endereco
    attributes:
      label: Endereço da tela
      description: A URL exata (com o caminho completo) onde o problema aparece.
    validations:
      required: false
  - type: input
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador e versão, celular ou computador, tema claro ou escuro.
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Erro do console
      description: Se houver, cole a mensagem do F12 → Console (sem dados pessoais).
    validations:
      required: false
